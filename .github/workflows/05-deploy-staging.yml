name: 05 - Deploy to Staging (Manual Approval Gate)

# Teaches: environments with protection rules, manual approval gates,
#          conditional jobs, job needs/dependencies, deployment concurrency.

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type DEPLOY to confirm staging deployment'
        required: true
        default: ''

# Prevent concurrent staging deployments
concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  # ── Guard ──────────────────────────────────────────────────────────────────
  preflight-check:
    name: Preflight Checks
    runs-on: ubuntu-latest
    outputs:
      confirmed: ${{ steps.check.outputs.confirmed }}

    steps:
      - name: Validate deployment confirmation
        id: check
        run: |
          if [ "${{ inputs.confirm_deploy }}" = "DEPLOY" ]; then
            echo "confirmed=true" >> "$GITHUB_OUTPUT"
            echo "Deployment confirmed. Proceeding."
          else
            echo "confirmed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Confirmation string must be exactly DEPLOY. Got: ${{ inputs.confirm_deploy }}"
            exit 1
          fi

  # ── Deploy ─────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging Org
    runs-on: ubuntu-latest
    needs: preflight-check
    if: needs.preflight-check.outputs.confirmed == 'true'
    environment:
      name: staging
      # Configure "staging" environment in: Settings → Environments
      # Add required reviewers and SFDX_STAGING_AUTH_URL secret there.

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@latest

      - name: Authenticate to Staging Org
        run: |
          echo "${{ secrets.SFDX_STAGING_AUTH_URL }}" > ./auth-url.txt
          sf org login sfdx-url --sfdx-url-file ./auth-url.txt --alias staging
          rm ./auth-url.txt

      - name: Deploy to Staging (check-only first)
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org staging \
            --dry-run \
            --wait 20
        continue-on-error: false

      - name: Deploy to Staging (actual)
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org staging \
            --wait 30

      - name: Run specified tests post-deploy
        run: |
          sf apex run test \
            --target-org staging \
            --class-names LoanApplicationServiceTest \
            --output-dir ./staging-test-results \
            --result-format junit \
            --wait 20

      - name: Upload staging test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-test-results
          path: staging-test-results/
          retention-days: 30

  # ── Notify ─────────────────────────────────────────────────────────────────
  notify-result:
    name: Post Deployment Summary
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: always()

    steps:
      - name: Summarise deployment
        run: |
          echo "## Staging Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | ${{ github.sha }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | ${{ github.ref_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Result | ${{ needs.deploy-staging.result }} |" >> "$GITHUB_STEP_SUMMARY"
